description: VIRCAM DP2 pipeline based on Rubin Data Release Production
instrument: lsstuk.obs.vista.VIRCAM
imports:
  - $DRP_PIPE_DIR/pipelines/_ingredients/DRP-minimal-calibration.yaml

tasks:
  vircamIsr: lsstuk.obs.vista.VircamIsrTask

  makeDirectWarp:
    class: lsst.drp.tasks.make_direct_warp.MakeDirectWarpTask
    config:
      connections.warp: direct_warp
      connections.masked_fraction_warp: direct_warp_masked_fraction
  makePsfMatchedWarp:
    class: lsst.drp.tasks.make_psf_matched_warp.MakePsfMatchedWarpTask
    config:
      connections.direct_warp: direct_warp
      connections.psf_matched_warp: psf_matched_warp

  selectDeepCoaddVisits:
    class: lsst.pipe.tasks.selectImages.BestSeeingSelectVisitsTask
    config:
      connections.goodVisits: deep_coadd_visit_selection

  assembleCoadd:
    class: lsst.drp.tasks.assemble_coadd.CompareWarpAssembleCoaddTask
    config:
      connections.inputWarps: direct_warp
      connections.psfMatchedWarps: psf_matched_warp
      connections.selectedVisits: deep_coadd_visit_selection
      connections.coaddExposure: deep_coadd_predetection
      connections.nImage: deep_coadd_n_image
      connections.inputMap: deep_coadd_input_map

  assembleCellCoadd:
    class: lsst.drp.tasks.assemble_cell_coadd.AssembleCellCoaddTask
    config:
      connections.inputWarps: direct_warp
      connections.maskedFractionWarps: direct_warp_masked_fraction
      connections.multipleCellCoadd: deep_coadd_cell_predetection

  detectCoaddPeaks:
    class: lsst.pipe.tasks.multiBand.DetectCoaddSourcesTask
    config:
      useCellCoadds: true
      connections.detectionSchema: object_detection_schema
      connections.exposure: deep_coadd_predetection
      connections.exposure_cells: deep_coadd_cell_predetection
      connections.outputBackgrounds: deep_coadd_background
      connections.outputSources: object_detection
      connections.outputExposure: deep_coadd

  rewriteCellCoadd:
    class: lsst.pipe.tasks.rewrite_images.RewriteCellCoaddTask
    config:
      do_alternate_background_fit: false
      connections.legacy_cell_coadd: deep_coadd_cell_predetection
      connections.object_background: deep_coadd_background
      connections.object_mask: deep_coadd.mask
      connections.future_cell_coadd: deep_coadd_cell

  mergeDetections:
    class: lsst.pipe.tasks.mergeDetections.MergeDetectionsTask
    config:
      connections.schema: object_detection_schema
      connections.catalogs: object_detection
      connections.outputSchema: object_detection_merged_schema
      connections.outputPeakSchema: object_detection_peak_schema
      connections.outputCatalog: object_detection_merged

  deconvolve:
    class: lsst.meas.extensions.scarlet.deconvolveExposureTask.DeconvolveExposureTask
    config:
      useCellCoadds: true
      connections.coadd: deep_coadd
      connections.coadd_cell: deep_coadd_cell_predetection
      connections.background: deep_coadd_background
      connections.catalog: object_detection_merged
      connections.deconvolved: deconvolved_deep_coadd

  deblend:
    class: lsst.pipe.tasks.deblendCoaddSourcesPipeline.DeblendCoaddSourcesMultiTask
    config:
      useCellCoadds: true
      connections.inputSchema: object_detection_merged_schema
      connections.peakSchema: object_detection_peak_schema
      connections.mergedDetections: object_detection_merged
      connections.coadds: deep_coadd
      connections.coadds_cell: deep_coadd_cell_predetection
      connections.backgrounds: deep_coadd_background
      connections.deconvolvedCoadds: deconvolved_deep_coadd
      connections.outputSchema: object_deblend_schema
      connections.deblendedCatalog: object_deblend
      connections.scarletModelData: object_scarlet_models

  vircamMeasure:
    class: lsst.pipe.tasks.multiBand.MeasureMergedCoaddSourcesTask
    config:
      useCellCoadds: true
      connections.inputSchema: object_deblend_schema
      connections.scarletCatalog: object_deblend
      connections.scarletModels: object_scarlet_models
      connections.exposure: deep_coadd
      connections.exposure_cells: deep_coadd_cell_predetection
      connections.background: deep_coadd_background
      connections.outputSchema: object_unforced_measurement_schema
      connections.outputSources: object_unforced_measurement
      connections.refCat: "the_monster_20250219_vista"

  mergeMeasurements:
    class: lsst.pipe.tasks.mergeMeasurements.MergeMeasurementsTask
    config:
      connections.inputSchema: object_unforced_measurement_schema
      connections.catalogs: object_unforced_measurement
      connections.outputSchema: object_ref_measurement_schema
      connections.mergedCatalog: object_ref_measurement

  forcedPhotCoadd:
    class: lsst.drp.tasks.forcedPhotCoadd.ForcedPhotCoaddTask
    config:
      useCellCoadds: true
      connections.inputSchema: object_ref_measurement_schema
      connections.exposure: deep_coadd
      connections.exposure_cell: deep_coadd_cell_predetection
      connections.background: deep_coadd_background
      connections.refCat: object_ref_measurement
      connections.refCatInBand: object_unforced_measurement
      connections.scarletModels: object_scarlet_models
      connections.refWcs: deep_coadd.wcs
      connections.measCat: object_forced_measurement


subsets:
  singleFrame:
    subset:
      - vircamIsr
      - calibrateImage
      - transformSourceTable
      - consolidateSourceTable
      - consolidateVisitSummary
      - makeCcdVisitTable
      - makeVisitTable
      - updateVisitSummary
    description: |
      Complete VIRCAM single-frame and visit-level processing, from ISR and
      detector calibration through source-table consolidation and visit-summary
      generation.

  step1:
    subset:
      - vircamIsr
      - calibrateImage
      - transformSourceTable
    description: |
      Run detector-level VIRCAM processing: instrumental signature removal,
      image calibration, and transformation of detector source catalogs.
      This step should be run on complete visits rather than with tract or patch
      constraints, since later processing requires all detectors contributing
      to each visit.

  step2:
    subset:
      - consolidateSourceTable
      - consolidateVisitSummary
      - isolatedStarAssociation
      - finalizeCharacterizationDetector
      - consolidateFinalizeCharacterization
      - makeCcdVisitTable
      - makeVisitTable
      - updateVisitSummary
    description: |
      Build the visit- and tract-level products required for coaddition,
      including consolidated source tables, visit summaries, isolated-star
      associations, finalized characterization products, and visit metadata.
      This step should be run after step1 with the appropriate skymap
      constraint and without restricting processing to an incomplete subset
      of detectors within a visit.

  step3:
    subset:
      - makeDirectWarp
      - makePsfMatchedWarp
      - selectDeepCoaddVisits
      - assembleCoadd
      - assembleCellCoadd
      - detectCoaddPeaks
      - rewriteCellCoadd
      - mergeDetections
      - deconvolve
      - deblend
      - vircamMeasure
      - mergeMeasurements
      - forcedPhotCoadd
    description: |
      Run the complete VIRCAM coadd and multiband-processing workflow for a
      selected tract or patch. This includes warp generation, DP2-style
      ExposureF and CellCoadd construction, source detection, CellCoadd
      rewriting, multiband detection merging, Scarlet deblending, source
      measurement, and forced coadd photometry.
      For development and production runs, the workflow is normally split into
      step3a, step3b, and step3c.

  step3a:
    subset:
      - makeDirectWarp
      - makePsfMatchedWarp
    description: |
      Create direct and PSF-matched VIRCAM warps for DP2-style coaddition,
      including the masked-fraction and noise-realization products required by
      the CellCoadd workflow.

  step3b:
    subset:
      - selectDeepCoaddVisits
      - assembleCoadd
      - assembleCellCoadd
      - detectCoaddPeaks
      - rewriteCellCoadd
    description: |
      Select input visits and construct the DP2-style predetection coadds in
      both ExposureF and MultipleCellCoadd representations. Run cell-based
      source detection, produce the object background and detection catalog,
      and rewrite the post-detection product into the final CellCoadd.

  step3c:
    subset:
      - mergeDetections
      - deconvolve
      - deblend
      - vircamMeasure
      - mergeMeasurements
      - forcedPhotCoadd
    description: |
      Run multiband processing on the detected coadds. Merge detections across
      bands, deconvolve the coadds, perform Scarlet deblending, measure sources
      in each band, select the reference measurements, and perform forced coadd
      photometry.
      In CellCoadd mode, the image-based tasks use
      deep_coadd_cell_predetection together with deep_coadd and
      deep_coadd_background.
